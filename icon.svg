<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F28B82"/>
      <stop offset="1" stop-color="#E0695F"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#F4B400"/>
    </linearGradient>
  </defs>

  <!-- stacked repo cards (back to front) -->
  <g stroke="#2F3A4A" stroke-width="14" stroke-linejoin="round">
    <rect x="124" y="56" width="264" height="300" rx="28" fill="#7C8EA6"/>
    <rect x="96" y="92" width="264" height="300" rx="28" fill="#A5B4C8"/>
    <rect x="68" y="128" width="264" height="300" rx="28" fill="#D9E1EC"/>
  </g>
  <!-- card header bars -->
  <rect x="104" y="164" width="120" height="18" rx="9" fill="#2F3A4A"/>
  <rect x="104" y="204" width="80" height="14" rx="7" fill="#7C8EA6"/>
  <rect x="104" y="234" width="100" height="14" rx="7" fill="#7C8EA6"/>

  <!-- shield -->
  <path d="M336 164 L448 204 V300 C448 372 398 430 336 456 C274 430 224 372 224 300 V204 Z"
        fill="url(#shield)" stroke="#2F3A4A" stroke-width="16" stroke-linejoin="round"/>

  <!-- padlock -->
  <path d="M300 300 V276 C300 254 316 238 336 238 C356 238 372 254 372 276 V300"
        fill="none" stroke="#2F3A4A" stroke-width="16" stroke-linecap="round"/>
  <rect x="284" y="296" width="104" height="80" rx="14" fill="url(#lock)" stroke="#2F3A4A" stroke-width="14"/>
  <circle cx="336" cy="330" r="11" fill="#2F3A4A"/>
  <rect x="330" y="330" width="12" height="24" rx="6" fill="#2F3A4A"/>
</svg>
